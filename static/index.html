<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streak</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="topbar">
    <div class="brand">
      <span class="logo">🔥</span>
      <span class="brand-name">Streak</span>
    </div>
    <div class="tabs">
      <a href="/" class="tab active">Aujourd'hui</a>
      <span class="tab disabled" title="Bientôt disponible">Historique</span>
      <span class="tab disabled" title="Bientôt disponible">Séries &amp; Stats</span>
    </div>
  </nav>

  <header class="day-header">
    <div class="day-header-main">
      <p id="today-date" class="date-label"></p>
      <h1>Aujourd'hui</h1>
    </div>

    <div class="day-header-badges">
      <div class="badge badge-ratio">
        <span id="ratio-value" class="badge-value"></span>
        <span class="badge-label">atteintes</span>
      </div>

      <div id="mood" class="mood" aria-hidden="true"></div>

      <div class="badge badge-essentials">
        <span class="badge-label">Essentielles</span>
        <span id="essentials-value" class="badge-value"></span>
      </div>
    </div>
  </header>

  <main>
    <section>
      <h2>Aujourd'hui</h2>
      <ul id="habit-list"></ul>
    </section>

    <section>
      <h2>Nouvelle habitude</h2>
      <form id="habit-form">
        <input name="name" placeholder="Nom" required />

        <select name="kind">
          <option value="binary">Binaire</option>
          <option value="quantified">Quantifiée</option>
        </select>

        <input name="unit" placeholder="Unité (optionnel)" />

        <select name="period_scope">
          <option value="day">Jour</option>
          <option value="week">Semaine</option>
          <option value="month">Mois</option>
          <option value="year">Année</option>
        </select>

        <input name="cadence" type="number" min="1" value="1" title="Cadence" />
        <input name="target" type="number" step="0.01" min="0" value="1" required title="Cible" />

        <select name="direction">
          <option value="at_least">Au moins</option>
          <option value="at_most">Au plus</option>
        </select>

        <label><input name="is_essential" type="checkbox" /> Essentielle</label>

        <button type="submit">Créer</button>
      </form>
      <p id="habit-form-error" class="error"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
