<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streak</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="topbar">
    <div class="brand">
      <span class="logo">🔥</span>
      <span class="brand-name">Streak</span>
    </div>
    <div class="tabs">
      <a href="/" class="tab active">Aujourd'hui</a>
      <a href="/historique.html" class="tab">Historique</a>
      <span class="tab disabled" title="Bientôt disponible">Séries &amp; Stats</span>
    </div>
  </nav>

  <header class="day-header">
    <div class="day-header-main">
      <p id="today-date" class="date-label"></p>
      <h1 id="page-title">Aujourd'hui</h1>

      <div class="date-nav">
        <div class="segmented" data-field="nav-scope" data-value="day">
          <button type="button" class="segmented-option active" data-value="day">Jour</button>
          <button type="button" class="segmented-option" data-value="week">Semaine</button>
          <button type="button" class="segmented-option" data-value="month">Mois</button>
          <button type="button" class="segmented-option" data-value="year">Année</button>
        </div>
        <button type="button" id="nav-prev" class="pagination-arrow" aria-label="Période précédente">‹</button>
        <button type="button" id="nav-today" class="toggle-pill">Aujourd'hui</button>
        <button type="button" id="nav-next" class="pagination-arrow" aria-label="Période suivante">›</button>
        <span id="readonly-badge" class="readonly-badge" hidden>Lecture seule</span>
      </div>
    </div>

    <div class="day-header-badges">
      <div class="badge badge-ratio">
        <span id="ratio-value" class="badge-value"></span>
        <span class="badge-label">atteintes</span>
      </div>

      <div id="mood" class="mood" aria-hidden="true"></div>

      <div class="badge badge-essentials">
        <span class="badge-label">Essentielles</span>
        <span id="essentials-value" class="badge-value"></span>
      </div>
    </div>
  </header>

  <main>
    <section id="creation-section">
      <h2>Nouvelle habitude</h2>
      <form id="habit-form">
        <div class="form-row form-row-main">
          <input name="name" placeholder="Nom de l'habitude, ex : Faire 30 pompes" required />
          <button type="button" id="essential-toggle" class="toggle-pill" data-active="false">
            ★ Essentielle
          </button>
          <button type="submit">+ Ajouter</button>
        </div>

        <div class="form-row">
          <div class="field-group">
            <span class="field-label">Type</span>
            <div class="segmented" data-field="kind" data-value="binary">
              <button type="button" class="segmented-option active" data-value="binary">
                Binaire
              </button>
              <button type="button" class="segmented-option" data-value="quantified">
                Quantifiée
              </button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">Cadence</span>
            <div class="segmented" data-field="period_scope" data-value="day">
              <button type="button" class="segmented-option active" data-value="day">
                Quotidien
              </button>
              <button type="button" class="segmented-option" data-value="week">Hebdo</button>
              <button type="button" class="segmented-option" data-value="month">Mensuel</button>
              <button type="button" class="segmented-option" data-value="year">Annuel</button>
            </div>
          </div>

          <div class="field-group" id="cadence-count-group" hidden>
            <span class="field-label">Nombre de fois</span>
            <input name="cadence" type="number" min="1" value="1" class="input-small" />
          </div>
        </div>

        <div class="form-row" id="quantified-fields" hidden>
          <div class="field-group">
            <span class="field-label">Objectif à atteindre</span>
            <div class="field-inline">
              <input name="target" type="number" step="0.01" min="0" placeholder="ex : 2.7" class="input-small" />
              <input name="unit" placeholder="unité : L" class="input-small" />
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">Direction</span>
            <div class="segmented" data-field="direction" data-value="at_least">
              <button type="button" class="segmented-option active" data-value="at_least">
                Au moins
              </button>
              <button type="button" class="segmented-option" data-value="at_most">Au plus</button>
            </div>
          </div>
        </div>
      </form>
      <p id="habit-form-error" class="error"></p>
    </section>

    <section>
      <div class="section-header-row">
        <h2 id="cards-heading">Aujourd'hui</h2>
        <div class="pagination-info">
          <span id="pagination-label"></span>
          <button type="button" id="prev-page" class="pagination-arrow" aria-label="Précédent">‹</button>
          <button type="button" id="next-page" class="pagination-arrow" aria-label="Suivant">›</button>
        </div>
      </div>
      <div id="habit-cards" class="habit-cards"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
